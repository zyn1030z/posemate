# Posely AI — static analysis configuration.
#
# Strictness philosophy: the analyzer is the first reviewer. We enable
# strict type checks and a curated lint set on top of flutter_lints,
# plus riverpod_lint via custom_lint for provider misuse detection.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Freezed/json_serializable annotations on constructors trip this.
    invalid_annotation_target: ignore
    # Dart 3.11 does not support null-aware map elements; suppress until
    # Flutter is upgraded past 3.41 to a Dart 3.12+ SDK.
    use_null_aware_elements: ignore
    # CupertinoPageTransitionsBuilder needs cupertino import even when
    # material.dart re-exports it — the analyzer disagrees.
    unnecessary_import: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
  # NOTE: custom_lint plugin (riverpod_lint) re-enabled once custom_lint
  # supports analyzer >=9 alongside riverpod_generator 4.x.

linter:
  rules:
    # ── Style & consistency ─────────────────────────────────────────
    - always_declare_return_types
    - avoid_bool_literals_in_conditional_expressions
    - avoid_field_initializers_in_const_classes
    - avoid_positional_boolean_parameters
    - avoid_redundant_argument_values
    - avoid_unused_constructor_parameters
    - directives_ordering
    - eol_at_end_of_file
    - leading_newlines_in_multiline_strings
    - omit_local_variable_types
    - prefer_asserts_with_message
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    # sort_pub_dependencies intentionally off — pubspec groups by concern.
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants
    - use_string_buffers
    - use_super_parameters

    # ── Correctness ─────────────────────────────────────────────────
    - always_use_package_imports
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - no_adjacent_strings_in_list
    - no_self_assignments
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements

    # ── Flutter-specific ────────────────────────────────────────────
    - avoid_unnecessary_containers
    - sized_box_shrink_expand
    - use_colored_box
    - use_decorated_box

    # ── Documentation ───────────────────────────────────────────────
    - comment_references
