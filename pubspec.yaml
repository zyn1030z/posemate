name: posely_ai
description: >-
  Posely AI — an AI-powered pose assistant that helps you recreate
  professional photography poses with realtime guidance.
publish_to: "none"

# Versioning: MAJOR.MINOR.PATCH+BUILD — build number is bumped by CI.
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.0

  # ── Navigation ────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ── Data classes / serialization ──────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # ── Networking ────────────────────────────────────────────────────
  dio: ^5.11.0
  retrofit: ^4.9.2
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.1

  # ── Local storage ─────────────────────────────────────────────────
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.6

  # ── Firebase ──────────────────────────────────────────────────────
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  firebase_messaging: ^16.4.3

  # ── Auth providers ────────────────────────────────────────────────
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  flutter_facebook_auth: ^7.2.0
  local_auth: ^3.0.2

  # ── Camera & on-device AI ─────────────────────────────────────────
  camera: ^0.12.0+2
  google_mlkit_pose_detection: ^0.15.0
  google_mlkit_face_detection: ^0.14.0
  google_mlkit_selfie_segmentation: ^0.11.0
  image_picker: ^1.2.3
  # image: ^4.9.1 — re-add in Phase 7 (pose extraction). Removed: xml conflict with flutter_native_splash on Flutter 3.41.
  gal: ^2.3.3
  wakelock_plus: ^1.7.0
  sensors_plus: ^7.1.0
  flutter_tts: ^4.2.5

  # ── UI / media ────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.0
  shimmer: ^3.0.0

  # ── Monetization / sharing ────────────────────────────────────────
  in_app_purchase: ^3.3.0
  share_plus: ^13.3.0

  # ── Platform / system ─────────────────────────────────────────────
  permission_handler: ^13.0.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  flutter_displaymode: ^0.7.0
  # flutter_native_splash: ^2.4.0 — re-add when Flutter is upgraded past 3.41 (meta 1.17 conflict)

  # ── Observability ─────────────────────────────────────────────────
  talker_flutter: ^5.1.20
  talker_dio_logger: ^5.1.20
  talker_riverpod_logger: ^5.1.20

  # ── Utilities ─────────────────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.6.0
  collection: ^1.19.1
# vector_math is pinned by flutter_test — track the SDK's pin.
  vector_math: ^2.2.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Lints ─────────────────────────────────────────────────────────
  flutter_lints: ^6.0.0
  # NOTE: riverpod_lint/custom_lint are intentionally absent — current
  # custom_lint (analyzer ^8) cannot coexist with riverpod_generator 4.x
  # (analyzer ^13). Re-add both when custom_lint supports analyzer >=9.

  # ── Code generation ───────────────────────────────────────────────
# Floor kept low: 2.15.2+ requires meta ^1.18.3, but Flutter 3.44 pins 1.18.0.
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  # riverpod_generator: ^4.0.0 — not used (manual providers), re-add with Flutter upgrade
  retrofit_generator: ^10.0.0
# Floor kept low: 1.11.3+ requires analyzer ^14 which retrofit_generator caps.
  hive_ce_generator: ^1.8.0

  # ── Testing ───────────────────────────────────────────────────────
  mocktail: ^1.0.5

  # ── App icons ─────────────────────────────────────────────────────
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_version: 23
  # iOS respects the OS mask; Android uses adaptive foreground over background.
  adaptive_icon_background: "#0B0D11"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/mock/
    - assets/mock/lineart/
    - assets/fonts/OFL-Inter.txt

  # Inter (text) + Inter Display (large headings) — SIL OFL 1.1, license
  # bundled at assets/fonts/OFL-Inter.txt and surfaced on the About screen.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterDisplay-ExtraBold.ttf
          weight: 800

dependency_overrides:
  objective_c: 9.1.0
